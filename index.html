<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Memorize List</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }
  #textbox {
    width: 100%;
    height: 150px;
    margin-bottom: 10px;
    padding: 8px;
    box-sizing: border-box;
    white-space: pre-wrap;
  }
  button {
    margin-bottom: 20px;
    padding: 8px 16px;
    cursor: pointer;
  }
  table {
    border-collapse: collapse;
    width: 100%;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: left;
  }
  th {
    background-color: #f0f0f0;
  }
</style>
</head>
<body>
  <button id="copyBtn">Copy to Clipboard</button>
  <textarea id="textbox" placeholder="Strings will appear here..."></textarea>
  <div id="tableContainer"></div>

<script>
const CSV_URL = 'data.csv';

function getUTCTPlus8Date() {
  const date = new Date();
  const utcPlus8 = new Date(date.getTime() + (8 * 60 * 60 * 1000));
  const y = utcPlus8.getUTCFullYear();
  const m = String(utcPlus8.getUTCMonth() + 1).padStart(2, '0');
  const d = String(utcPlus8.getUTCDate()).padStart(2, '0');
  return `${y}/${m}/${d}`;
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  return lines.map(line => line.split(',').map(s => s.trim()));
}

function loadCSV() {
  fetch(CSV_URL)
    .then(response => response.text())
    .then(text => {
      const data = parseCSV(text);
      processCSV(data);
    })
    .catch(err => {
      console.error('Failed to load CSV:', err);
    });
}

function processCSV(data) {
  if (data.length < 3) return;

  const today = getUTCTPlus8Date();
  const colA = 0;
  const colB = 1;
  const colC = 2;

  // Find today's row: column B matches today
  let todayRow = -1;
  for (let i = 1; i < data.length; i++) {
    if (data[i][colB] === today) {
      todayRow = i;
      break;
    }
  }

  const textbox = document.getElementById('textbox');
  if (todayRow === -1) {
    textbox.value = `未找到今天（${today}）的学习记录。`;
    renderTable(data);
    return;
  }

  let outputText = "【SAT单词进度】\n";
  outputText += today + "\n";
  outputText += "背：" + data[todayRow][colC] + "\n";
  outputText += "------------------------\n";
  outputText += "复习：\n";

  // Columns G(6) through N(13)
  for (let col = 6; col <= 13; col++) {
    const reviewVal = data[todayRow][col];
    const colName = data[1][col]; // header row is index 1 (second row)

    if (reviewVal !== '' && !isNaN(reviewVal) && Number(reviewVal) > 0) {
      const targetNum = Number(reviewVal);
      // Match against column A
      let matchRow = -1;
      for (let i = 1; i < data.length; i++) {
        if (Number(data[i][colA]) === targetNum) {
          matchRow = i;
          break;
        }
      }
      if (matchRow !== -1) {
        const reviewContent = data[matchRow][colC];
        outputText += "[" + colName + "] " + reviewContent + "\n";
      }
    }
  }

  textbox.value = outputText;
  renderTable(data);
}

function renderTable(data) {
  const container = document.getElementById('tableContainer');
  container.innerHTML = '';
  if (data.length === 0) return;

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');
  data[0].forEach(cell => {
    const th = document.createElement('th');
    th.textContent = cell;
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  for (let i = 1; i < data.length; i++) {
    const tr = document.createElement('tr');
    data[i].forEach(cell => {
      const td = document.createElement('td');
      td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  container.appendChild(table);
}

document.getElementById('copyBtn').addEventListener('click', () => {
  const textbox = document.getElementById('textbox');
  textbox.select();
  document.execCommand('copy');
});

loadCSV();
</script>
</body>
</html>
